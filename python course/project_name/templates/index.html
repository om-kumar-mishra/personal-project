<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea Form</title>
</head>
<body>
    {{name}}
    <h1>Submit Your Text</h1>
    <form action="/remove" method="get">
        <label for="userInput">Enter your text:</label><br><br>
        <textarea id="userInput" name="text" rows="10" cols="30" placeholder="Write something here..."></textarea><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
